      <stop offset="1" stop-color="#85502E"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1337" height="827" fill="url(#bg)"/>

  <!-- 가을 낙엽 (양옆 여백 장식) -->
  <g fill="#D19A5B" opacity="0.5">
    <path d="M0 -18 Q14 0 0 18 Q-14 0 0 -18 Z" transform="translate(250 200) rotate(35) scale(1.4)"/>
    <path d="M0 -18 Q14 0 0 18 Q-14 0 0 -18 Z" transform="translate(180 560) rotate(-20) scale(1.1)"/>
    <path d="M0 -18 Q14 0 0 18 Q-14 0 0 -18 Z" transform="translate(1080 260) rotate(60) scale(1.2)"/>
    <path d="M0 -18 Q14 0 0 18 Q-14 0 0 -18 Z" transform="translate(1150 610) rotate(-45) scale(1.5)"/>
  </g>

  <!-- 바닥 그림자 -->
  <ellipse cx="668" cy="712" rx="210" ry="24" fill="#5A3A20" opacity="0.18" filter="url(#soft)"/>

  <!-- 꼬리 -->
  <path d="M735 690 C880 700 965 600 955 480 C945 380 890 300 815 285 C830 330 860 390 855 445 C850 510 800 560 745 580 Z" fill="url(#tail)"/>
  <path d="M790 662 C890 652 937 572 930 482" stroke="#EBCBA2" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M760 640 C870 640 915 560 905 470 C898 400 865 340 830 310" stroke="#4E2C18" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.7"/>

