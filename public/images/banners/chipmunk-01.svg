    <circle cx="648" cy="645" r="7"/>
    <circle cx="700" cy="645" r="7"/>
  </g>
  <!-- 벨트 -->
  <path d="M580 590 L757 590 L761 610 L576 610 Z" fill="#A8723F"/>
  <rect x="656" y="586" width="26" height="28" rx="3" fill="none" stroke="#E9C995" stroke-width="4"/>

