  <ellipse cx="588" cy="412" rx="26" ry="15" fill="#E58F78" opacity="0.4"/>
  <ellipse cx="748" cy="412" rx="26" ry="15" fill="#E58F78" opacity="0.4"/>

  <!-- 눈 -->
  <ellipse cx="622" cy="365" rx="12" ry="14" fill="#1E1410"/>
  <ellipse cx="714" cy="365" rx="12" ry="14" fill="#1E1410"/>
  <circle cx="626" cy="359" r="4" fill="#FFFFFF"/>
  <circle cx="718" cy="359" r="4" fill="#FFFFFF"/>

  <!-- 코 + 입 + 앞니 -->
  <path d="M658 392 Q668 386 678 392 Q676 402 668 405 Q660 402 658 392 Z" fill="#4A2B1E"/>
  <path d="M668 405 L668 413" stroke="#4A2B1E" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M652 414 Q660 424 668 414 Q676 424 684 414" stroke="#4A2B1E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <rect x="662" y="417" width="12" height="11" rx="2" fill="#FFFFFF" stroke="#E2D3BE" stroke-width="1.5"/>
  <path d="M668 417 L668 428" stroke="#E2D3BE" stroke-width="1.5"/>

  <!-- 베레모 -->
  <ellipse cx="676" cy="262" rx="110" ry="22" fill="#3A1A10" opacity="0.15" filter="url(#soft)"/>
  <ellipse cx="690" cy="238" rx="120" ry="46" fill="url(#beret)" transform="rotate(-12 690 238)"/>
  <circle cx="702" cy="192" r="9" fill="#682129"/>
