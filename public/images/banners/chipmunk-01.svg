  <ellipse cx="668" cy="476" rx="95" ry="18" fill="#5A3A20" opacity="0.2" filter="url(#soft)"/>

  <!-- 귀 -->
  <circle cx="548" cy="262" r="36" fill="url(#fur)"/>
  <circle cx="548" cy="265" r="20" fill="#E3A98E"/>
  <circle cx="788" cy="262" r="36" fill="url(#fur)"/>
  <circle cx="788" cy="265" r="20" fill="#E3A98E"/>

  <!-- 머리 -->
  <ellipse cx="668" cy="350" rx="150" ry="128" fill="url(#fur)"/>
  <ellipse cx="668" cy="400" rx="100" ry="66" fill="url(#cream)"/>

  <!-- 다람쥐 줄무늬 (이마 + 눈 옆) -->
  <path d="M668 270 L668 305" stroke="#5A3420" stroke-width="16" stroke-linecap="round" opacity="0.8"/>
  <path d="M600 346 Q578 338 552 324" stroke="#F4E2C6" stroke-width="8" fill="none" stroke-linecap="round"/>
