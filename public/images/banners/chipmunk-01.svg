  <path d="M610 470 Q668 455 726 470 L770 660 Q775 690 745 692 L591 692 Q561 690 566 660 Z" fill="url(#coat)"/>
  <!-- 셔츠 + 라펠 -->
  <path d="M640 468 L668 540 L696 468 Z" fill="#F7F1E6"/>
  <path d="M640 468 L668 540 L620 502 Z" fill="#B88247"/>
  <path d="M696 468 L668 540 L716 502 Z" fill="#B88247"/>
