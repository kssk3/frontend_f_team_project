<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1337 827" width="1337" height="827">
  <!-- 학습용 오리지널 다람쥐 캐릭터 (mock id 1 · MOA ATELIER · FW 트렌치코트) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6EBDD"/>
      <stop offset="1" stop-color="#EBD8BF"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#CF935C"/>
      <stop offset="0.6" stop-color="#B07040"/>
      <stop offset="1" stop-color="#8E5530"/>
    </radialGradient>
    <radialGradient id="cream" cx="0.45" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFF6E8"/>
      <stop offset="1" stop-color="#EED8B8"/>
    </radialGradient>
    <radialGradient id="coat" cx="0.35" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#DDAE72"/>
      <stop offset="1" stop-color="#B07A42"/>
    </radialGradient>
    <radialGradient id="beret" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#A3434D"/>
      <stop offset="1" stop-color="#682129"/>
    </radialGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3F7867"/>
      <stop offset="1" stop-color="#28503F"/>
    </linearGradient>
    <radialGradient id="tail" cx="0.4" cy="0.3" r="0.85">
